<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @font-face {
            font-family: "font-logo";
            src: url("Fonts/font-collectionHr/main-netflix-san/NetflixSans-Bold.woff2") format(woff2);
        }

        :root {
            --logo-font: font-logo;
            --margin-between: 0.4rem;
        }

        * {
            box-sizing: border-box;
            margin: 0;
        }

        body {
            margin: 0;

        }

        #auto-row-container {
            display: grid;
            width: 100%;
            min-height: fit-content;
            grid-auto-flow: row;
            grid-auto-rows: max-content;
            overflow: hidden;
        }

        #nav {
            display: flex;
            height: 12vh;
            width: 100%;
            background-color: black;
            color: white;
            justify-content: space-between;
        }

        #nav p {
            font-size: 3rem;
            margin: 0;
            /* font-family: var(--logo-font); */
            letter-spacing: -1px;
            font-weight: 700;
            padding-left: 2rem;
            text-decoration: overline;
            text-underline-offset: 1px;
            padding-top: 1.2rem;
            text-decoration-color: yellow;
            color: rgb(255, 234, 0);
            text-shadow:
                -4px 0px 0 orange;
            text-shadow:
                -4px 0px 0 rgb(0, 92, 0),
                -4.5px 0px 0 orange;

        }

        #nav span {
            /* display: inline-block; */
            /* vertical-align: top; */
            /* or middle */
            text-decoration: none;

            text-decoration: underline;
            text-decoration-color: yellow;
            color: lightblue;
            text-shadow: 2px 0px 0 rgb(0, 0, 0);
            font-style: italic;
            letter-spacing: 1.5px;
            text-underline-offset: 3px;
            text-decoration-thickness: 8px;
            text-decoration-style: dotted;

        }

        #nav h3 {
            font-size: clamp(1.4rem, 2vh, 2rem);
            color: white;
            margin-right: 2rem;
            align-self: center;
            font-style: italic;

        }

        #content-container {
            display: grid;
            grid-template-columns: 4.5vw 91vw 4.5vw;
            grid-template-rows: max-content;
            grid-template-areas: ". middle .";


        }

        #the-content-need {
            display: flex;
            height: fit-content;
            grid-area: middle;
            background-color: whitesmoke;

            background-color: rgb(108, 111, 108);
            background-color: rgb(156, 117, 117);
            background-color: transparent;

            margin: var(--margin-between);
            justify-content: space-around;
            padding-bottom: var(--margin-between);
            border-radius: 0 0 6px 6px;
            gap: 3px;

        }

        #the-content-need img {
            max-width: 40vw;
            aspect-ratio: 16/9;
            margin-top: var(--margin-between);
            /* margin-top: 1.4rem; */
            align-self: flex-start;
            border: 2px solid rgb(9, 162, 238);
            border-spacing: 2px;
            /* box-shadow: 0px 2px 8px black; */
            filter: brightness(80%);

        }

        #event-section {
            display: grid;
            width: 50vw;
            grid-auto-flow: row;
            grid-auto-rows: max-content;
            background-color: white;
            background-color: white;
            border: 0.5px solid black;
            border-left: none;
            border-right: none;

            margin-top: var(--margin-between);
            border-radius: 0 0 6px 6px;
            max-height: 50vh;
            min-width: 40vh;
            overflow-y: auto;
            position: relative;

        }

        #event-section h2 {
            justify-self: center;
            position: sticky;
            width: 100%;
            text-align: center;
            top: 0%;
            background-color: white;
            padding: 0 auto;
        }


        #event-section p {
            padding-left: 20px;
            margin-bottom: var(--margin-between);
            font-size: larger;
            font-weight: 600;
        }

        #event-section h3 {
            padding-left: 20px;
            margin-bottom: var(--margin-between);
            font-weight: 700;
            font-size: 1.5rem;
            position: sticky;
            top: 7%;
            background-color: white;
        }

        #purchase-div {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        #purchase-div button {
            min-height: 9vh;
            min-width: 25vh;
            color: white;
            background-color: black;
            border-radius: 9px;
            margin-top: 15vw;
            margin-bottom: 5vh;




        }

        .purchase-div2 button {
            min-height: 9vh;
            min-width: 25vh;
            color: white;
            background-color: black;
            border-radius: 9px;
            margin-top: 5vh;
            margin-bottom: 5vh;




        }

        .purchase-div2 {
            display: flex;
            width: 50%;
            margin: 0 auto;
            margin-left: 49vw;
            justify-content: center;
            gap: 2vw;
        }

        .for-random-div {
            display: block;

            width: 100%;
            /* height: 400px; */
            /* background-color: red; */

        }

        .cart-alert {
            position: fixed;
            min-width: 150px;
            padding: 2px;
            border: 1px solid indigo;
            background: rgb(255, 224, 224);
            color: black;
            font-size: medium;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            bottom: 10%;
        }
    </style>
</head>

<body>
    <div id="auto-row-container">
        <div id="nav">
            <p>Bibl<span id="text-section">yie</span></p>
            <h3>Biblyie knows you're here :)</h3>
        </div>

        <section class="display-book">

        </section>
    </div>
    <script>
        let currentBookId = localStorage.getItem("bookClickID").trim();
        let cUser = ""
        let bookName = ""
        if (true) {
            document.querySelector(".display-book").innerHTML = `
        <div id="content-container">
            <div id="the-content-need">
                <img src="" alt="image">
                <div id="event-section">
                   
                </div>
            </div>

        </div>
        `;
            let newRandom = document.createElement("div");
            console.log(newRandom)
            newRandom.classList.add("for-random-div")
            document.querySelector("#auto-row-container").appendChild(newRandom)
            document.querySelector(".for-random-div").innerHTML = `
                    <div class="purchase-div2"><button type="button" >Purchase</button><button type="button" class="add-cart">Add to cart</button></div> 
        
        `
        }

        if (true) {
            let getID = localStorage.getItem("bookClickID");
            console.log(getID);
            async function getTheClick() {
                let response = await fetch(`http://localhost:3000/bookRcmndd/${getID}`);
                let Data = await response.json();
                console.log(Data)
                let EventSection = document.querySelector("#the-content-need")
                bookName = Data.title
                EventSection.innerHTML = `<img src="${Data.imageurl}" alt="image">
                <div id="event-section">
                    <h2>This is Biblyie back pack for you </h2>
                    <H3> ${Data.title}</h3>
                    <p>Book ID: ${Data.id}</p>
                    <p>MRP: ${Data.actualprice}</p>
                    <p>Byblyie price :  ${Data.currentprice}</p>
                    <p>Stock:  ${Data.stockcount}</p>
                    <p>Info:  ${Data.details}</p>
                    <p>Category:  ${Data.wholeTag}</p>`;
                // <div id="purchase-div"><button type="button">Purchase</button><button type="button" class="add-cart" >Add to cart</button></div>
                console.log(Data.imageurl)

            }
            getTheClick()
        }

        //-------------------------------ADD CART ACTION----------------------------------------------------

        if (true) {
            let count = 1;
            let newCartItem;
            let generatedToken = localStorage.getItem("genToken")
            let cartAlert = document.createElement("div");
            document.body.appendChild(cartAlert);
            function showCartAlert(){
                  setTimeout(() => {
                            cartAlert.style.display = "none"
                            document.querySelector(".add-cart").disabled = false
                        },8000)


                        cartAlert.style.display = "inline-block"
                        document.querySelector(".add-cart").disabled = true
            }
            document.querySelector(".add-cart").addEventListener("click", (e) => {
                e.preventDefault()
                fetch(`http://localhost:3000/loggedUser/${generatedToken}`)
                    .then(response => {
                        return response.json()
                    })
                    .then(currentUser => {
                        cUser = currentUser.user.trim();
                        return cUser
                    })
                    .then(cUser => {
                        return fetch(`http://localhost:3000/payLoadPurchase/${cUser}`)
                    })
                    .then(response => {
                        return response.json()
                    })
                    .then(record => {
                        if (record.cart.length > 20) {
                            console.log("Cart Overflow");
                            return

                        }

                        let mulCheck = record.cart.some((rcd, _) => {
                            return rcd.id.trim() === currentBookId
                        })


                        if (!mulCheck) {
                            newCartItem = {
                                id: currentBookId,
                                bookName: bookName,
                                count: 1
                            }
                            console.log("success new add")
                            record.cart.push(newCartItem)
                            return fetch(`http://localhost:3000/payLoadPurchase/${cUser}`, {
                                method: "PUT",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify(record)

                            })
                        }
                        else {
                            let countChange = record.cart.find(b => b.id === currentBookId)

                            //    countChange.count=8;
                            countChange.count = Number(countChange.count) + 1;
                            console.log("success", record, countChange.count)
                            return fetch(`http://localhost:3000/payLoadPurchase/${cUser}`, {
                                method: "PUT",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify(record)

                            })
                        }

                    })
                    .then(() => {

                        console.log("cart message");
                        cartAlert.classList.add("cart-alert")
                        cartAlert.innerHTML = `<p>Item added to cart.</p>`
                        showCartAlert()
                      
                    })
                    .catch(error => console.log("Causes error while adding to cart", error.message))

            })

        }

    </script>
</body>

</html>
