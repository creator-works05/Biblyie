<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        margin: 0;
        background: linear-gradient(to bottom, rgba(82, 132, 212, 0.897) 0%, rgb(47, 98, 174) 30%);
        backdrop-filter: blur(20px) brightness(100%);
    }

    * {
        box-sizing: border-box;
    }

    .assign-book-grid {
        display: grid;
        width: 100%;
        height: max-content;
        grid-template-columns: minmax(50px, 15vw) 1fr;
        grid-template-areas: "side main";




    }


    .bookcaseflex {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 20px;
        border: 1px solid rgb(0, 3, 205);
        border-top: 1px;
        align-content: flex-start;

        grid-area: main;
        padding: 20px;
        position: relative;
        z-index: 0;
    }


    .bookcaseflex::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        background: linear-gradient(to bottom, rgba(82, 132, 212, 0.897) 0%, rgb(47, 98, 174) 30%);
        backdrop-filter: blur(20px) brightness(50%);
    }

    .blank {

        /* background-color: cadetblue; */
        /* position: static; */
        /* z-index: -1; */
        position: relative;
        z-index: 0;
    }

    .blank::after,
    .blank::before {
        content: "";
        position: absolute;
        inset: 0;


    }

    .blank::before {
        z-index: -2;
        /* background: rgba(103, 103, 7, 0.882); */
        /* background: rgba(0, 0, 0, 0.408); */
        backdrop-filter: blur(20px);
    }

    .blank::after {
        z-index: -1;
        /* background: linear-gradient(to bottom, rgba(102, 143, 247, 0.971) 0%, rgba(255, 96, 96, 0.518) 50%); */
        backdrop-filter: blur(20px) saturate(80%);

    }


    .blank>div {
        position: sticky;
        background-color: transparent;
        height: 100vh;
        min-width: 50px;
        max-width: 15vw;
        top: 22px;
        z-index: 0;
        overflow: scroll;
        scrollbar-width: none;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        gap: 2vw;
        padding-top: 3vw;
        padding-bottom: 3vw;
        box-shadow: 6px 0px 0px black;


    }

    /* .blank>div::before{
        content:"";
        position: absolute;
        inset:0;
        z-index: -2;
        background:linear-gradient(to bottom,rgba(112, 2, 2, 0.468) 0%, transparent 95% );
        backdrop-filter:blur(20px) brightness(150%);

    }
    .blank>div::after{
        content:"";
        position:absolute;
        inset:0;
        z-index: -1;
        background:linear-gradient(to bottom,  rgba(25, 2, 180, 0.268) 0%, transparent 95%);
        backdrop-filter:blur(20px);

    } */

    #main-tag-scroll {
        position: sticky;
        top: 0;
        display: flex;
        margin: 0;
        flex-wrap: wrap;
        /* width: 100%; */
        z-index: 6;



    }


    .tag-scroll {
        display: flex;
        min-width: 10vw;
        flex-wrap: nowrap;
        overflow-x: auto;
        scrollbar-width: none;
        flex: 1;
        justify-content: start;
        /* background:black; */



    }



    #main-tag-button-grid {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: max-content;
        gap: 8px;
        /* background-color: rgb(0, 0, 79); */


    }

    #main-tag-button-grid>div {
        background-color: rgb(183, 182, 186);
        border: 2px solid rgb(129, 0, 0);
        border-radius: 4px;
        width: 500px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    #main-tag-button-grid>div h2 {
        margin: 0;
        font-size: large;
        overflow: hidden;
    }

    #main-tag-button-grid>div h3 {
        margin: 0;
        display: none;
    }

    #scrollR {
        position: relative;
        min-width: 50px;
        color: white;
        max-width: 10vw;
        border: 0;
        z-index: 0;

    }

    #scrollR::after {
        content: "";
        position: absolute;
        inset: 0;
        right: 0px;
        bottom: -2px;
        top: -2px;
        left: -70px;
        background: linear-gradient(to left, rgb(7, 1, 78) 47px, rgb(0, 0, 0) 48px, rgba(0, 0, 0, 0.726) 59px, rgba(0, 0, 0, 0.212) 80%, transparent 100%);
        border: 0;
        z-index: -1;
    }

    #scrollL {
        min-width: 50px;
        max-width: 10vw;
        position: relative;
        z-index: 0;
        background-color: transparent;
        border: 0;
        color: white;
    }

    #scrollL::after {
        content: "";
        position: absolute;
        inset: 0;
        right: -70px;
        bottom: -2px;
        top: -2px;
        left: 0px;
        background: linear-gradient(to right, rgb(7, 1, 78) 47px, rgb(0, 0, 0) 48px, rgba(0, 0, 0, 0.726) 59px, rgba(0, 0, 0, 0.212) 80%, transparent 100%);
        border: 0;
        z-index: -1;
    }


    .random {
        height: 70vw;
    }

    .blank-sticky>button {

        min-width: 90%;

        min-height: 2%;
        /* height: 20%; */
        background-color: transparent;
        flex-shrink: 0;
        color: black;
        font-size: 1rem;
        font-weight: bolder;
        text-align: center;
        vertical-align: middle;
        border-radius: 40px;
        position: relative;
        box-shadow: 1px 0px 10px rgb(0, 0, 0), -1px 0px 10px rgb(142, 142, 142);
        /* border: 1px solid black; */
        z-index: 0;


    }

    .blank-sticky>button::after,
    .blank-sticky>button::before {
        content: "";
        position: absolute;
        border-radius: 40px;
        inset: 0;
    }

    .blank-sticky>button::before {
        z-index: -2;
        /* background:rgb(255, 255, 4); */
        /* background:rgb(27, 149, 231); */
        background: rgba(0, 6, 9, 0.558);
        background: rgba(222, 222, 222, 0.686);
        backdrop-filter: blur(100px);
    }

    .blank-sticky>button::after {
        z-index: -1;
        background: rgba(87, 157, 58, 0.518);
        backdrop-filter: blur(20px);

    }

    .blank-sticky>button h5 {
        display: none;
    }



    .book-frame {
        background: wheat;
        /* background:rgba(245, 222, 179, 0.292); */
        border-radius: 8px;
        padding: 10px;
        color: black;
        min-height: 260px;
        display: grid;
        grid-template-rows: auto 1fr auto;
        justify-items: center;
        align-items: center;
        align-items: center;
        border: 1px solid rgb(30, 169, 255);
        filter: brightness(80%);
        box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.599), -3px -2px 8px rgb(162, 157, 157);

        position: relative;
        z-index: 0;
    }

    .book-frame::before {
        content: "";
        inset: 0;
        position: absolute;
        /* background:linear-gradient(to right,rgba(0, 0, 0, 0.416) 0%,transparent 2% ),
                linear-gradient(to left,rgba(0, 0, 0, 0.416) 0%,transparent 2% ),
                linear-gradient(to top,rgba(0, 0, 0, 0.416) 0%,transparent 2% ),
                linear-gradient(to bottom,rgba(0, 0, 0, 0.416) 0%,transparent 2% ); */
        /* background: wheat; */
        z-index: -1;
    }

    .book-frame * {
        margin: 0;
    }

    .book-frame>img {
        width: 96%;
        aspect-ratio: 16/9;
        background-color: black;
        color: white;
    }

    .book-frame-desc {
        overflow: hidden;
        overflow-wrap: break-word;
        word-break: break-all;
        white-space: normal;
        padding: 0;
        margin: 2px 2px 0px 2px;
        height: 50px;
        text-overflow: hidden;
    }

    .bookid-frame {
        display: none;
    }

    .forBookIdFetch {
        display: none;
    }

    /* -----------------------------------------------NAV CSS---------------------- */
    #nav {
        display: flex;
        flex-wrap: nowrap;
        min-height: 50px;
        max-height: 10vw;
        background-color: transparent;
        /* background: linear-gradient(to bottom,darkslateblue 20%,blue); */
        color: wheat;


        position: relative;
        z-index: 0;

    }

    #nav::before {
        content: "";
        position: absolute;
        inset: 0;
        background-color: rgba(0, 19, 80, 0.996);
        backdrop-filter: blur(12px) saturate(80%);

        z-index: -2;

    }

    .button-long-effect {
        background:black;
        color: wheat;

    }
</style>

<body>
    <div id="nav">
        <h1>Explore Biblyie world</h1>

    </div>
    <div id="main-tag-scroll">
        <button id="scrollL">
            << </button>
                <div class="tag-scroll">
                    <div id="main-tag-button-grid">
                        <div class="tag-button helloBtnTag">
                            <h2>All</h2>
                            <h3>#All</h3>
                        </div>

                    </div>
                </div>
                <button id="scrollR">>></button>
    </div>
    <div class="assign-book-grid">
        <div class="blank">
            <div class="blank-sticky">



            </div>
        </div>
        <div class="bookcaseflex">
            <!-- -----------------------------BOOKS WILL BE LISTED HERE ----------------------------------- -->
        </div>
    </div>

    </div>
    <!-- <div class="random" width="500" height="1000">hello</div> -->

    <!-- FOR SCRIPT------------------------------------------- -->
    <script>

        let mainTagButtonGrid = document.querySelector("#main-tag-button-grid");
        async function fetchTags() {
            try {
                let response = await fetch("http://localhost:3000/maintagCategory");
                let fetchedData = await response.json();
                fetchedData.forEach(element => {
                    let splitArray = element.main.split("#")

                    mainTagButtonGrid.innerHTML += `<div class="tag-button"><h2>${splitArray[1]}</h2>
                        <h3>${element.main}</h3></div>`

                });

            }
            catch (e) {
                console.log("error occurred while fetching tags", e.message)
            }
        }
        fetchTags();
        let fetchedBooksTop;
        if (true) {
            let blankSticky = document.querySelector(".blank-sticky")
            let assignBookGrid = document.querySelector(".assign-book-grid")
            let dotBlank = document.querySelector(".blank")
            let bookcaseflex = document.querySelector(".bookcaseflex")
            let mainTagButtonGrid = document.querySelector("#main-tag-button-grid");
            let helloBtnTag = document.querySelector(".helloBtnTag")
            let defaultTag = "#All"
            async function defBook() {
                let response = await fetch("http://localhost:3000/bookRcmndd");
                let fetchedBooks = await response.json();

                bookcaseflex.innerHTML = "";
                for (let i = 0; i < fetchedBooks.length; i++) {
                    let bookItem = fetchedBooks[i];
                    bookcaseflex.innerHTML += `<div class="book-frame">
                        <h3>${bookItem.title}</h3>
                        <img src="${bookItem.imageurl}" alt="Image is not available now">
                        <p class="book-frame-desc">${bookItem.details} </p>
                        <p>₹ ${bookItem.currentprice}</p>
                        <h4 class="bookid-frame">${bookItem.wholeTag}</h4>
                        <p class="forBookIdFetch"> ${bookItem.id}</p>
                        
                        </div>`

                }
            }
            if (defaultTag === "#All") {
                // --------------------Hide side------------------------------------------
                assignBookGrid.style.gridTemplateColumns = "0vw 100%"
                dotBlank.style.display = "none"
                // bookcaseflex.style.minWidth="100%"
                bookcaseflex.style.gridArea = "main"
                // --------------------Hide side------------------------------------------

                defBook();

            }

            mainTagButtonGrid.addEventListener("click", async (e) => {
                const tagButton = e.target.closest(".tag-button");
                if (!tagButton) {
                    return;
                }
                const pickedTag = tagButton.querySelector("h3").textContent;
                tagButton.style.backgroundColor = "red";
                tagButton.style.color = "blue";
                setTimeout(() => {
                    tagButton.style.backgroundColor = "rgb(183, 182, 186)";
                    tagButton.style.color = "black";
                }, 200)
                let response = await fetch("http://localhost:3000/bookRcmndd");
                let fetchedBooks = await response.json();
                let broughtBook = fetchedBooks;
                fetchedBooksTop = broughtBook;
                console.log(broughtBook)
                let wholeTagRes = await fetch("http://localhost:3000/addedWholeTag");
                let wholeTagGet = await wholeTagRes.json();
                if (pickedTag === "#All") {
                    // --------------------Hide side------------------------------------------
                    assignBookGrid.style.gridTemplateColumns = "0vw 100%"
                    dotBlank.style.display = "none"
                    // bookcaseflex.style.minWidth="100%"
                    bookcaseflex.style.gridArea = "main"
                    // --------------------Hide side------------------------------------------
                    bookcaseflex.innerHTML = "";

                    for (let i = 0; i < fetchedBooks.length; i++) {
                        let bookItem = fetchedBooks[i];
                        bookcaseflex.innerHTML += `<div class="book-frame">
                            <h3>${bookItem.title}</h3>
                            <img src="${bookItem.imageurl}" alt="Image is not available now">
                            <p class="book-frame-desc">${bookItem.details} </p>
                            <p>₹ ${bookItem.currentprice}</p>
                            <h4 class="bookid-frame">${bookItem.wholeTag}</h4>
                            <p class="forBookIdFetch"> ${bookItem.id}</p>
                            
                            </div>`

                    }
                    return;
                }
                else {
                    // --------------------Hide side------------------------------------------
                    assignBookGrid.style.gridTemplateColumns = " minmax(50px, 15vw) 1fr"
                    dotBlank.style.display = "block"
                    // bookcaseflex.style.minWidth="100%"
                    bookcaseflex.style.gridArea = "main"
                    dotBlank.style.gridArea = "side"
                    // --------------------Hide side------------------------------------------
                    blankSticky.innerHTML = ``;
                    for (let i = 0; i < wholeTagGet.length; i++) {
                        let splitWhole = wholeTagGet[i].comboTag.split("#");
                        if ("#" + splitWhole[1] === pickedTag) {
                            blankSticky.innerHTML += `
                                <button class="sub-tag-button">
                                    <p>${splitWhole[2]}</p>
                                    <h5 class="side-inside-button">${wholeTagGet[i].comboTag}</h5>
                                    </button>`;




                        }
                    }

                    // ___________________________________________________________________________________________________________
                    bookcaseflex.innerHTML = "";
                    for (let i = 0; i < fetchedBooks.length; i++) {
                        let bookItem = fetchedBooks[i];

                        let currentBookId = bookItem.wholeTag.split("#");

                        if (pickedTag === "#" + currentBookId[1]) {
                            bookcaseflex.innerHTML += `<div class="book-frame">
                                        <h3>${bookItem.title}</h3>
                                        <img src="${bookItem.imageurl}" alt="Image is not available now">
                                        <p class="book-frame-desc">${bookItem.details} </p>
                                        <p>₹ ${bookItem.currentprice}</p>
                                        <h4 class="bookid-frame">${bookItem.wholeTag}</h4>
                                        <p class="forBookIdFetch"> ${bookItem.id}</p>
                                        
                                        </div>`
                        }

                    }
                    console.log(fetchedBooksTop)
                }
            })
        }
        // ---------------------------------sidebar control---------------
        let bookcaseflex = document.querySelector(".bookcaseflex")

        let blankSticky = document.querySelector(".blank-sticky");
        blankSticky.addEventListener("click", async (e) => {

            let currentButton = e.target.closest("button");
            if (!currentButton) return;
            let response = await fetch("http://localhost:3000/bookRcmndd");
            let fetchedBooks = await response.json();
            bookcaseflex.innerHTML = "";
            for (let i = 0; i < fetchedBooks.length; i++) {
                let fromBtn = currentButton.querySelector("h5").textContent;
                let bookItem = fetchedBooks[i]

                if (fromBtn === bookItem.wholeTag) {
                    bookcaseflex.innerHTML += `<div class="book-frame">
                        <h3>${bookItem.title}</h3>
                        <img src="${bookItem.imageurl}" alt="Image is not available now">
                        <p class="book-frame-desc">${bookItem.details} </p>
                        <p>₹ ${bookItem.currentprice}</p>
                        <h4 class="bookid-frame">${bookItem.wholeTag}</h4>
                        <p class="forBookIdFetch"> ${bookItem.id}</p>
                        
                        </div>`
                }

            }
        })
        // -------------------------ADDING EFFECTS TO BUTTON-------------------------------------------
        if (true) {
            let dotBlankSticky = document.querySelector(".blank-sticky");
            dotBlankSticky.addEventListener("click", (e) => {
                // try {
                    let allButton = dotBlankSticky.querySelectorAll("button");
                    console.log(allButton)
                    for (let i = 0; i < allButton.length; i++) {
                        allButton[i].classList.add("button-long-effect")
                        let isClass=allButton[i].classList.contains("button-long-effect")
                        console.log(isClass)
                    }
                    console.log(e.target.closest(".button-long-effect"))   
                    e.target.closest(".button-long-effect").style.border="3px solid red"
                    e.target.closest(".button-long-effect").style.transform="scale(1.1)"
                    e.target.closest(".button-long-effect").style.backgroundColor="black"

                
                    // }
                // catch (e) {
                    // console.log("error occured", e.message)
                // }

            })



        }


    </script>

</body>

</html>
