<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div id="auth-section">
        <div id="logContainer">
            <form id="loginForm">
                <label>Username: <input type="text" name="username" id="loginname" placeholder="Enter your name">
                </label><br><br>
                <label>Password : <input type="password" name="password" id="pass-log"
                        placeholder="Enter your Password">
                </label>
                <br><br>
                <button> Submit</button>
                <button type="reset">Reset</button>
            </form>
        </div>
    </div>

    <script>
        if(!localStorage.getItem("username")){
        let usernameInpt = prompt("Enter your signup username");
        let passwordInpt = prompt("Enter your signup password");
        localStorage.setItem("username", usernameInpt);
        localStorage.setItem("password", passwordInpt);

        }
       

        let form = document.querySelector("#loginForm");
        form.addEventListener("submit", (e) => {
            e.preventDefault();

            let username = e.target.username.value;
            let password = e.target.password.value;
            if (!username || !password) {
                alert("fill required fields properly");
                return;
            }
            let getUsername = localStorage.getItem("username");
            let getPassword = localStorage.getItem("password");
            if (getUsername === username && getPassword === password) {
                window.location.href = "index.html";
                console.log(window.location.href);
            }
            else {
                alert("login failed");
            }
            form.reset();
            setItemCheck++;
        })
    </script>
</body>

</html>
