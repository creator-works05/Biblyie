<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Highlight</title>

    <style>
        .button-flex {
            display: flex;
            flex-wrap: wrap;
            background-color: wheat;
            min-width: 100%;
            height: 90vh;
            padding: 20px;
            gap: 10px;
        }

        /* Base button style */
        .secondary-style {
            width: 150px;
            height: 30px;
            background-color: white;
            color: black;
            border: 1px solid black;
            cursor: pointer;
        }

        /* Highlight / Active button style */
        .active-button {
            background-color: green;
            color: white;
        }
    </style>
</head>

<body>

    <div class="button-flex">
        <button class="secondary-style">Button 1</button>
        <button class="secondary-style">Button 2</button>
        <button class="secondary-style">Button 3</button>
        <button class="secondary-style">Button 4</button>
        <button class="secondary-style">Button 5</button>
        <button class="secondary-style">Button 6</button>
        <button class="secondary-style">Button 7</button>
        <button class="secondary-style">Button 8</button>
        <button class="secondary-style">Button 9</button>
        <button class="secondary-style">Button 12</button>
        <button class="secondary-style">Button 34</button>
        <button class="secondary-style">Button 56</button>
    </div>

    <script>
        let buttons = document.querySelectorAll(".secondary-style");
        let count=0;
        document.querySelector(".button-flex").addEventListener("click", (e) => {
            let target = e.target.closest(".secondary-style");
            if (!target) return; // If clicking empty space, ignore

            // Remove active class from all buttons
            for(let i=0;i<buttons.length;i++){
                buttons[i].classList.remove("active-button")
                console.log(target===buttons[i],buttons[i])
            }


            // Add active class to clicked button
            target.classList.add("active-button");
        });
    </script>

</body>
</html>
